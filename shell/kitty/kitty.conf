################################################################################
# BAZILEROS MODERN ONE DARK CONFIG - CACHYOS / KDE EDITION
################################################################################

# --- FONT SETTINGS ---
font_family         JetBrainsMono Nerd Font
bold_font           auto
italic_font         auto
bold_italic_font     auto
font_size            14.0
disable_ligatures    never

# --- MODERN UI & DECORATIONS ---
# Fixes the disappeared buttons in KDE Wayland
hide_window_decorations no
window_padding_width    15
placement_strategy      center
background_opacity      0.90
background_blur         1
confirm_os_window_close 0

# --- CURSOR & MOUSE ---
# Modern smooth trail (Kitty 0.30+)
cursor_trail            3
cursor_trail_decay      0.1 0.4
cursor_shape            block
cursor_blink_interval   0.5
shell_integration       enabled
copy_on_select          yes
mouse_hide_wait         2.0

# --- PERFORMANCE ---
repaint_delay    8
input_delay      2
sync_to_monitor  yes

# --- ONE DARK PRO COLORS ---
foreground           #abb2bf
background           #1e222a
selection_foreground #282c34
selection_background #abb2bf
url_color            #61afef
cursor               #528bff
url_style            curly

# --- PILL STYLE TAB BAR ---
tab_bar_edge              top
tab_bar_margin_width      9
tab_bar_margin_height     9 0
tab_bar_style             separator
tab_separator             ""
tab_title_template        "{fmt.fg._3e4452}{fmt.bg.default}{fmt.fg._abb2bf}{fmt.bg._3e4452} {title} {fmt.fg._3e4452}{fmt.bg.default} "
active_tab_title_template "{fmt.fg._61afef}{fmt.bg.default}{fmt.fg._282c34}{fmt.bg._61afef} {title} {fmt.fg._61afef}{fmt.bg.default} "

# --- TERMINAL COLORS (16 COLORS) ---
# Black
color0 #282c34
color8 #545862
# Red
color1 #e06c75
color9 #e06c75
# Green
color2 #98c379
color10 #98c379
# Yellow
color3 #e5c07b
color11 #e5c07b
# Blue
color4 #61afef
color12 #61afef
# Magenta
color5 #c678dd
color13 #c678dd
# Cyan
color6 #56b6c2
color14 #56b6c2
# White
color7 #abb2bf
color15 #ffffff

# --- KEYMAPS & WORKFLOW ---
# Clipboard
map ctrl+c              copy_or_interrupt
map ctrl+v              paste_from_clipboard
map shift+insert        paste_from_selection

# Layouts
enabled_layouts         tall, stack, grid, fat
map ctrl+shift+z        toggle_layout stack

# Window/Tab management (Opens in same directory)
map ctrl+shift+enter    launch --cwd=current --type=window
map ctrl+shift+t        launch --cwd=current --type=tab
map ctrl+shift+w        close_window
map ctrl+shift+]        next_window
map ctrl+shift+[        previous_window

# Font resizing
map ctrl+shift+up       increase_font_size
map ctrl+shift+down     decrease_font_size
map ctrl+shift+backspace restore_font_size

# Miscellaneous
allow_remote_control    yes
listen_on               unix:/tmp/mykitty
